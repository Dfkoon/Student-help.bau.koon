        // Populate the years and semesters dropdowns
        function updateSemesters() {
            const year = document.getElementById('year').value;
            const semesterSelect = document.getElementById('semester');
            semesterSelect.innerHTML = `
                <option value="fall">الفصل الدراسي الأول</option>
                <option value="spring">الفصل الدراسي الثاني</option>
                <option value="summer">الفصل الصيفي</option>
            `;
            updateHoursRange();
        }

        function updateHoursRange() {
            const semester = document.getElementById('semester').value;
            const hoursInput = document.getElementById('hours');
            if (semester === 'summer') {
                hoursInput.min = 1;
                hoursInput.max = 10;
                hoursInput.value = 5;
            } else {
                hoursInput.min = 12;
                hoursInput.max = 18;
                hoursInput.value = 15;
            }
        }

        function generateSchedule() {
            const year = document.getElementById('year').value;
            const semester = document.getElementById('semester').value;
            const hours = parseInt(document.getElementById('hours').value);
            const selectedCourses = courses[year][semester].slice(0, hours / 3);
            const tbody = document.getElementById('schedule-table').querySelector('tbody');
            tbody.innerHTML = '';

            selectedCourses.forEach(course => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${course.name}</td>
                    <td>${course.code}</td>
                    <td>${course.hours}</td>
                    <td>${course.prerequisite || 'لا يوجد'}</td>
                    <td>${course.category || 'لا يوجد'}</td>
                    <td>${course.format || 'وجاهي'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Initialize semesters on page load
        document.addEventListener('DOMContentLoaded', updateSemesters);
